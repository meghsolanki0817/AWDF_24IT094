version: "3.8"

services:
  mongo:
    image: mongo:6.0
    container_name: awdf-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: awdf-task-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/task-manager
      - PORT=3000
    depends_on:
      - mongo

volumes:
  mongo-data:
